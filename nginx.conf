server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;

    # SPA fallback: all paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively where filenames are content-addressed.
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache the Flutter bootstrap/runtime entrypoints because they keep
    # stable filenames across builds and would otherwise serve stale bundles.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    name: Build web (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=http://localhost:8000 \
            --dart-define=KEYCLOAK_URL=http://localhost:8080 \
            --dart-define=KEYCLOAK_REALM=second-brain \
            --dart-define=KEYCLOAK_CLIENT_ID=frontend

      - name: Serve built app
        run: |
          npm install -g serve
          serve -s build/web -l 3000 &
          sleep 3

      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 \
            -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_ENABLED=true \
            -e KC_HEALTH_ENABLED=true \
            quay.io/keycloak/keycloak:26.0 start-dev
          timeout 180 bash -c 'until curl -sf http://localhost:9000/health/ready; do sleep 5; done'

      - name: Setup Keycloak realm and test user
        run: |
          TOKEN_RESPONSE=$(curl -s -X POST \
            http://localhost:8080/realms/master/protocol/openid-connect/token \
            -d "username=admin&password=admin&grant_type=password&client_id=admin-cli")
          echo "Token response: $TOKEN_RESPONSE"
          TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          REALM_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/admin/realms \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d @keycloak/realm-export.json)
          echo "Realm import HTTP: $REALM_RESPONSE"

          USER_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:8080/admin/realms/second-brain/users \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","enabled":true,"credentials":[{"type":"password","value":"test","temporary":false}]}')
          echo "User create HTTP: $USER_RESPONSE"

          echo "OIDC discovery check:"
          curl -s http://localhost:8080/realms/second-brain/.well-known/openid-configuration | python3 -c "import sys,json; d=json.load(sys.stdin); print('issuer:', d.get('issuer')); print('auth_endpoint:', d.get('authorization_endpoint'))"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          APP_URL: http://localhost:3000
          KEYCLOAK_TEST_USER: ${{ secrets.KEYCLOAK_TEST_USER }}
          KEYCLOAK_TEST_PASSWORD: ${{ secrets.KEYCLOAK_TEST_PASSWORD }}
          CI: true
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

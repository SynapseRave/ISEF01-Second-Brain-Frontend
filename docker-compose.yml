services:
  # Keycloak wird vom Backend-Stack bereitgestellt (ISEF01-Second-Brain-Backend).
  # Keycloak-Admin-UI: http://localhost:8080  (admin / admin)
  # Kein eigener Keycloak-Container mehr — Frontend nutzt die Backend-Instanz.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
        KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
        KEYCLOAK_REALM: ${KEYCLOAK_REALM:-second-brain}
        KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-frontend}
        REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3000}
        GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
        GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
        MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
        MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
        MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
    ports:
      - "3000:80"
    restart: unless-stopped
